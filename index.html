<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLC / Internal / Dashboard — Rule Canvas</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1c2430; --muted:#6b7785; --line:#dce1e8;
    --read:#2f6fed; --write:#e8542b; --internal:#0d9488; --dash:#7c3aed;
    --chip:#f4f6f9; --ng:#e0473a; --ok:#56b733;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #root{height:100vh;display:flex;flex-direction:column}
  .topbar{height:52px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 18px;z-index:40}
  .topbar h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.2px}
  .topbar .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 13px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn:hover{background:var(--chip)}
  .btn.primary{background:var(--write);border-color:var(--write);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .legend{display:flex;gap:9px;align-items:center;font-size:12px}
  .legend .k{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;
    padding:4px 8px;border-radius:20px;border:1px solid transparent;color:var(--muted);font-weight:600}
  .legend .k.off{opacity:.4}
  .legend .k:hover{background:var(--chip)}
  .legend .sw{width:15px;height:3px;border-radius:2px}

  .stage{flex:1;position:relative;overflow:auto}
  .canvas{position:relative;min-width:1180px;min-height:100%;
    background-image:radial-gradient(#d4dae2 1px,transparent 1px);background-size:22px 22px;
    padding:26px 20px 60px;display:grid;grid-template-columns:210px 1fr 220px;gap:0}
  .col-head{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:7px}
  .col-head .dot{width:8px;height:8px;border-radius:50%}

  .rail{display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
  .rail.left{padding-right:34px}
  .rail.right{padding-left:34px}
  .tag{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    box-shadow:0 1px 2px rgba(20,30,50,.05);cursor:default}
  .tag .lab{font-size:12.5px;font-weight:600}
  .tag .addr{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px}
  .tag .dt{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;
    padding:1px 6px;border-radius:20px;margin-top:6px;text-transform:uppercase}
  .dt.boolean{background:#eaf1ff;color:var(--read)}
  .dt.number{background:#eafaf0;color:#1f9d55}
  .dt.string{background:#f3ecff;color:var(--dash)}

  .trees{display:flex;flex-direction:column;gap:20px;position:relative;z-index:2}
  .cycle{align-self:center;background:#1c2430;color:#fff;border-radius:11px;padding:9px 20px;
    font-size:13px;font-weight:700;box-shadow:0 3px 8px rgba(20,30,50,.18);position:relative}
  .cycle small{display:block;font-weight:500;font-size:10.5px;opacity:.7;letter-spacing:.4px}
  .capture{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:13px;padding:12px 14px 14px}
  .capture .cap-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .capture .cap-h .nm{font-size:13px;font-weight:700}
  .capture .cap-h .cc{font-size:10.5px;color:var(--muted);font-family:ui-monospace,monospace}
  .capture .cap-h .cam{width:22px;height:22px;border-radius:6px;background:#e7edf4;
    display:flex;align-items:center;justify-content:center;font-size:12px}
  .modrow{display:flex;flex-direction:column;gap:9px}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    position:relative;opacity:.5;transition:opacity .15s,box-shadow .15s,border-color .15s}
  .node.live{opacity:1}
  .node.hot{opacity:1;box-shadow:0 0 0 2px var(--hot,#2f6fed)33,0 3px 10px rgba(20,30,50,.12);border-color:var(--hot,#2f6fed)}
  .node .nh{display:flex;align-items:center;gap:7px}
  .node .ty{font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff;background:#94a3b3;padding:2px 6px;border-radius:5px}
  .node .nm{font-size:12.5px;font-weight:600}
  .ports{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .port{font-size:10px;color:var(--muted);background:var(--chip);border:1px solid var(--line);
    border-radius:20px;padding:2px 8px;font-family:ui-monospace,monospace}
  .port.used{background:#fff;color:var(--ink);border-color:#c3ccd8;font-weight:600}
  .nub{position:absolute;top:14px;width:9px;height:9px;border-radius:50%;background:#c3ccd8;border:2px solid #fff}
  .nub.L{left:-5px}.nub.R{right:-5px}

  .dsec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
  .dsec .dh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .dbtn{background:#faf5ff;border:1px solid #e6d8ff;border-radius:8px;padding:7px 10px;font-size:12px;
    font-weight:600;color:var(--dash);position:relative;margin-bottom:7px;cursor:default}
  .dbtn:last-child{margin-bottom:0}
  .dbtn .kind{font-size:9px;opacity:.7;font-weight:700;letter-spacing:.4px}
  .dbtn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);text-align:center}
  .dbtn.fresh{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.8);box-shadow:0 0 0 6px #7c3aed44}100%{transform:scale(1);box-shadow:none}}

  .edgelayer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:visible}
  .edge{fill:none;stroke-width:2;opacity:.9;transition:opacity .15s,stroke-width .15s}
  .edge.dim{opacity:.1}
  .edge.hot{stroke-width:3.2;opacity:1}
  .edge.internal{stroke-dasharray:6 5}
  .jdot{z-index:3}
  .elabel{position:absolute;transform:translate(-50%,-50%);z-index:4;background:#fff;border:1px solid var(--line);
    border-radius:7px;padding:2px 7px;font-size:10.5px;font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.1);
    pointer-events:auto;cursor:pointer;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  .elabel.dim{opacity:.2}
  .elabel .cnt{font-size:9px;background:var(--ink);color:#fff;border-radius:9px;padding:0 5px;margin-left:5px}

  .inspector{position:fixed;top:52px;right:0;bottom:0;width:352px;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-6px 0 22px rgba(20,30,50,.09);z-index:60;
    display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
  .inspector.open{transform:translateX(0)}
  .insp-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .insp-h .t{font-size:14px;font-weight:700}
  .insp-b{padding:14px 16px;overflow:auto;flex:1}
  .x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .fld select,.fld input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
  .row2{display:flex;gap:8px}.row2>*{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:none;background:#fff;padding:8px 4px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .srcchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;margin-bottom:4px}
  .actionitem{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:9px;background:var(--chip)}
  .actionitem .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .actionitem .ah .nm{font-size:12.5px;font-weight:700}
  .actionitem .rm{border:none;background:none;color:var(--ng);cursor:pointer;font-size:11px;font-weight:600}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin:2px 0 14px}
  .dirhint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
  .insp-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-direction:column}
  .insp-f .frow{display:flex;gap:8px}
  .insp-f .frow .btn{flex:1;text-align:center}
  .badge{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:5px;color:#fff}
  .errs{background:#fdecea;border:1px solid #f5c6c0;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .errs li{font-size:11.5px;color:#b3261e;margin-left:4px}
  .errs .eh{font-size:11px;font-weight:800;color:#b3261e;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .zbadge{font-size:9px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:80;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--panel);border-radius:12px;width:640px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,30,50,.3)}
  .modal pre{margin:0;padding:14px 16px;overflow:auto;font-size:11.5px;font-family:ui-monospace,monospace;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/jsx-source">
const {useState,useRef,useLayoutEffect,useEffect,useMemo} = React;

const SRC = {
  read:     {label:'PLC Read',  hex:'#2f6fed', desc:'PLC value → tree'},
  write:    {label:'PLC Write', hex:'#e8542b', desc:'tree → PLC'},
  internal: {label:'Internal',  hex:'#0d9488', desc:'tree → tree'},
  dashboard:{label:'Dashboard', hex:'#7c3aed', desc:'button → tree/PLC'},
};

// zone drives arrowhead target: plc | cycle | module | db | dashboard | capture
const ACTIONS = {
  'write-to-plc':       {label:'Write to PLC',       zone:'plc',      sources:['read','write','dashboard']},
  'trigger-image':      {label:'Trigger Image',      zone:'capture',  sources:['read','internal','dashboard']},
  'change-variant':     {label:'Change Variant',     zone:'cycle',    sources:['read','internal','dashboard']},
  'cycle-start':        {label:'Cycle Start',        zone:'cycle',    sources:['read','internal','dashboard']},
  'cycle-hold':         {label:'Cycle Hold',         zone:'cycle',    sources:['read','internal','dashboard']},
  'cycle-release':      {label:'Cycle Release',      zone:'cycle',    sources:['read','internal','dashboard']},
  'clear-captures':     {label:'Clear Captures',     zone:'cycle',    sources:['read','internal','dashboard']},
  'change-ground-truth':{label:'Change Ground Truth',zone:'module',   sources:['read','internal','dashboard']},
  'reverse-judgement':  {label:'Reverse Judgement',  zone:'module',   sources:['read','internal','dashboard']},
  'write-to-db':        {label:'Write to DB',        zone:'db',       sources:['read','internal','dashboard']},
  'dashboard-refresh':  {label:'Dashboard Refresh',  zone:'dashboard',sources:['read','internal','dashboard']},
};

const OPS = {
  boolean:[['=','='],['always','Always']],
  number :[['=','='],['!=','!='],['>','>'],['<','<'],['always','Always']],
  string :[['=','='],['!=','!='],['always','Always'],['partial','Partial Match']],
};

const PLC = [
  {id:'p1',lab:'Trigger In',  addr:'DCOIL 10', dt:'boolean'},
  {id:'p2',lab:'Part Present',addr:'REG 40001',dt:'number'},
  {id:'p3',lab:'Reject Out',  addr:'COIL 20',  dt:'boolean'},
  {id:'p4',lab:'Batch Code',  addr:'REG 40010',dt:'string'},
];
const VARIANTS=[{id:'v1',nm:'Variant A'},{id:'v2',nm:'Variant B'}];
const CAPTURES = [
  {id:'cc1',nm:'Cam 1 · Top',cc:'cfg_a1',modules:[
    {id:'m1',ty:'ODC',nm:'Assembly Check',ports:[['result','boolean'],['current_count','number'],['fail_count','number']]},
    {id:'m2',ty:'IC', nm:'Label Class',   ports:[['result','boolean'],['detected_class','string']]},
  ]},
  {id:'cc2',nm:'Cam 2 · Side',cc:'cfg_a2',modules:[
    {id:'m3',ty:'OCR', nm:'Batch OCR', ports:[['result','boolean'],['detected_text','string']]},
    {id:'m4',ty:'BEAD',nm:'Bead Weld', ports:[['result','boolean'],['caliper_pass_percentage','number']]},
  ]},
];
const DASH = [
  {id:'ds1',captureId:'cc1',title:'Cam 1 Panel',buttons:[]},
  {id:'ds2',captureId:'cc2',title:'Cam 2 Panel',buttons:[{id:'b1',label:'Re-run Cam 2',kind:'button'}]},
];

const SEED_RULES = [
  {id:'r1',source:'read',cond:{end:'plc',ref:'p2',op:'>',val:'0'},
   actions:[{name:'trigger-image',target:'cc1'}]},
  {id:'r2',source:'write',cond:{end:'node',ref:'m1',port:'result',op:'=',val:'NG'},
   actions:[{name:'write-to-plc',target:'p3',comm:'modbus-coil',valueMode:'literal',coilAddress:'20',val:'1'}]},
  {id:'r3',source:'internal',cond:{end:'node',ref:'m4',port:'caliper_pass_percentage',op:'<',val:'90'},
   actions:[{name:'cycle-hold',target:'cycle'}]},
  {id:'r4',source:'internal',cond:{end:'node',ref:'m2',port:'result',op:'=',val:'NG'},
   actions:[{name:'reverse-judgement',target:'m2'}]},
  {id:'r5',source:'dashboard',cond:{end:'button',ref:'b1'},
   actions:[{name:'trigger-image',target:'cc2'}]},
  {id:'r6',source:'read',cond:{end:'plc',ref:'p1',op:'=',val:'1'},
   actions:[{name:'cycle-start',target:'cycle'},{name:'change-variant',target:'v1'}]},
];

const moduleById=(id)=>{for(const c of CAPTURES){const m=c.modules.find(m=>m.id===id);if(m)return {mod:m,cap:c};}return null;};
const captureById=(id)=>CAPTURES.find(c=>c.id===id);
const plcById=(id)=>PLC.find(p=>p.id===id);
const variantById=(id)=>VARIANTS.find(v=>v.id===id);
const buttonById=(id)=>{for(const d of DASH){const b=d.buttons.find(b=>b.id===id);if(b)return {btn:b,sec:d};}return null;};

function deriveSource(cond,actions){
  if(cond.end==='button')return 'dashboard';
  if(cond.end==='plc')return 'read';
  if(actions.some(a=>ACTIONS[a.name]&&ACTIONS[a.name].zone==='plc'))return 'write';
  return 'internal';
}
function condText(cond){
  if(cond.end==='plc'){const p=plcById(cond.ref);return `${p?p.lab:cond.ref} ${cond.op==='always'?'(always)':cond.op+' '+cond.val}`;}
  if(cond.end==='button'){const b=buttonById(cond.ref);return `▶ ${b?b.btn.label:(cond._label||'button')}`;}
  const mb=moduleById(cond.ref);return `${mb?mb.mod.ty:''}.${cond.port} ${cond.op==='always'?'(always)':cond.op+' '+cond.val}`;
}
function actionText(a){
  const A=ACTIONS[a.name];let t=A?A.label:a.name;
  if(a.name==='write-to-plc'){const p=plcById(a.target);t+=` → ${p?p.lab:''}`;}
  else if(a.name==='trigger-image'){const c=captureById(a.target);t+=` → ${c?c.nm:''}`;}
  else if(a.name==='change-variant'){const v=variantById(a.target);t+=` → ${v?v.nm:''}`;}
  else if(A&&A.zone==='module'){const mb=moduleById(a.target);if(mb)t+=` → ${mb.mod.ty}`;}
  return t;
}

/* ---- edge endpoints per (rule, action) ---- */
function headFor(a,fromRight){
  const z=ACTIONS[a.name]?ACTIONS[a.name].zone:'cycle';
  if(z==='plc')      return {headId:`plc:${a.target}`,headSide:'R',headDir:1};
  if(z==='db')       return {headId:`dbsink`,headSide:'L',headDir:-1};
  if(z==='dashboard')return {headId:`dashcol`,headSide:'L',headDir:-1};
  const side=fromRight?'R':'L', dir=fromRight?1:-1;
  if(z==='capture')  return {headId:`cap:${a.target}`,headSide:side,headDir:dir};
  if(z==='module')   return {headId:`node:${a.target}`,headSide:side,headDir:dir};
  return {headId:`cyc`,headSide:side,headDir:dir}; // cycle
}
function segEnds(rule,a){
  const s=rule.source;
  if(s==='read')     return {tailId:`plc:${rule.cond.ref}`,tailSide:'R',tailDir:1, ...headFor(a,false)};
  if(s==='write')    return {tailId:`node:${rule.cond.ref}`,tailSide:'L',tailDir:-1, headId:`plc:${a.target}`,headSide:'R',headDir:1};
  if(s==='dashboard')return {tailId:`dash:${rule.cond.ref}`,tailSide:'L',tailDir:-1, ...headFor(a,true)};
  return {tailId:`node:${rule.cond.ref}`,tailSide:'R',tailDir:1, ...headFor(a,true)}; // internal
}

/* ---- validation ---- */
function validate(d){
  const e=[];
  if(d.cond.end==='button'&&!(d.cond._label||'').trim())e.push('Give the dashboard button a label.');
  if(d.cond.end!=='button'&&d.cond.op!=='always'&&!(d.cond.val||'').toString().trim())e.push('Condition needs a comparison value.');
  if(d.actions.length===0)e.push('Add at least one action.');
  d.actions.forEach((a,i)=>{
    const n=`Action ${i+1}`;
    if(a.name==='write-to-plc'){
      if(!a.target)e.push(`${n}: pick a PLC tag.`);
      if(a.valueMode==='literal'&&!(a.val||'').toString().trim())e.push(`${n}: enter a literal value.`);
      if(a.valueMode==='customkey'&&!a.keyRef)e.push(`${n}: pick a source key.`);
      if(a.comm==='ethernet'&&!(a.byteOffset||'').toString().trim())e.push(`${n}: EtherNet/IP needs a byte offset.`);
    }
    if(a.name==='change-variant'&&!a.target)e.push(`${n}: pick a target variant.`);
    if(a.name==='change-ground-truth'){
      if(!a.target)e.push(`${n}: pick a target module.`);
      if(!(a.gtValue||'').toString().trim())e.push(`${n}: enter the new ground-truth value.`);
    }
  });
  return e;
}

/* ---- export shape (approx condition_action_mapping) ---- */
function exportShape(rules){
  return rules.map(r=>{
    let key='',datatype='boolean';
    if(r.cond.end==='plc'){const p=plcById(r.cond.ref);key=`plc:${p?p.addr:r.cond.ref}`;datatype=p?p.dt:'boolean';}
    else if(r.cond.end==='node'){const mb=moduleById(r.cond.ref);key=mb?`_modType:${mb.mod.ty}_mod:${mb.mod.id}_${r.cond.port}`:r.cond.ref;
      const port=mb&&mb.mod.ports.find(x=>x[0]===r.cond.port);datatype=port?port[1]:'boolean';}
    else key=`button:${r.cond._label||r.cond.ref}`;
    return {id:r.id,source:r.source,typeOfConfig:r.source==='write'?'write':'read',
      condition:{key,operator:r.cond.op||'trigger',targetValue:r.cond.val||null,datatype},
      actions:r.actions.map(a=>({name:a.name,zone:ACTIONS[a.name]?ACTIONS[a.name].zone:null,params:stripParams(a)}))};
  });
}
function stripParams(a){const{name,...rest}=a;return rest;}

/* =======================================================================*/
function App(){
  const [rules,setRules]=useState(SEED_RULES);
  const [hover,setHover]=useState(null);
  const [sel,setSel]=useState(null);
  const [pos,setPos]=useState({});
  const [tick,setTick]=useState(0);
  const [builder,setBuilder]=useState(null);
  const [filter,setFilter]=useState({read:true,write:true,internal:true,dashboard:true});
  const [showJSON,setShowJSON]=useState(false);
  const [freshBtn,setFreshBtn]=useState(null);

  const canvasRef=useRef(null);
  const anchors=useRef({});
  const setA=(id)=>(el)=>{if(el)anchors.current[id]=el;};

  useLayoutEffect(()=>{
    const cv=canvasRef.current;if(!cv)return;
    const cr=cv.getBoundingClientRect();const p={};
    for(const id in anchors.current){
      const el=anchors.current[id];if(!el||!el.isConnected)continue;
      const r=el.getBoundingClientRect();
      p[id]={L:{x:r.left-cr.left,y:r.top-cr.top+r.height/2},
             R:{x:r.right-cr.left,y:r.top-cr.top+r.height/2},
             C:{x:r.left-cr.left+r.width/2,y:r.top-cr.top+r.height/2}};
    }
    setPos(p);
  },[rules,tick,builder]);

  useEffect(()=>{
    const relayout=()=>setTick(t=>t+1);
    window.addEventListener('resize',relayout);
    const stage=canvasRef.current?canvasRef.current.parentElement:null;
    if(stage)stage.addEventListener('scroll',relayout);
    const t=setTimeout(relayout,300);window.addEventListener('load',relayout);
    return()=>{window.removeEventListener('resize',relayout);
      if(stage)stage.removeEventListener('scroll',relayout);
      window.removeEventListener('load',relayout);clearTimeout(t);};
  },[]);

  const active=hover||sel;
  const involved=useMemo(()=>{
    const s=new Set();const r=rules.find(x=>x.id===active);if(!r)return s;
    if(r.cond.end==='node')s.add('node:'+r.cond.ref);
    if(r.cond.end==='plc')s.add('plc:'+r.cond.ref);
    r.actions.forEach(a=>{const z=ACTIONS[a.name]?ACTIONS[a.name].zone:'';
      if(z==='plc')s.add('plc:'+a.target);if(z==='module')s.add('node:'+a.target);if(z==='capture')s.add('cap:'+a.target);});
    return s;
  },[active,rules]);
  const liveNodes=useMemo(()=>{
    const s=new Set();rules.forEach(r=>{if(r.cond.end==='node')s.add(r.cond.ref);
      r.actions.forEach(a=>{if(ACTIONS[a.name]&&ACTIONS[a.name].zone==='module')s.add(a.target);});});
    return s;
  },[rules]);

  // build all visible segments + lane assignment
  const segments=useMemo(()=>{
    const segs=[];
    rules.filter(r=>filter[r.source]).forEach(r=>{
      r.actions.forEach((a,ai)=>{segs.push({rule:r,ai,ends:segEnds(r,a)});});
    });
    // lane grouping by gutter (left = read/write, right = internal/dashboard)
    const groups={};
    segs.forEach(s=>{const g=(s.rule.source==='read'||s.rule.source==='write')?'L':'R';
      (groups[g]=groups[g]||[]).push(s);});
    Object.values(groups).forEach(arr=>{
      arr.sort((a,b)=>a.rule.id.localeCompare(b.rule.id)+a.ai-b.ai);
      arr.forEach((s,i)=>{s.lane=i;});
    });
    return segs;
  },[rules,filter]);

  const buildPath=(ends,lane=0)=>{
    const t=pos[ends.tailId],h=pos[ends.headId];if(!t||!h)return null;
    const A=t[ends.tailSide]||t.C,B=h[ends.headSide]||h.C;
    // internal self-loop (same point)
    if(Math.abs(A.x-B.x)<4&&Math.abs(A.y-B.y)<4){
      const r=26+lane*8;
      return {d:`M${A.x},${A.y} C${A.x+r+30},${A.y-r} ${A.x+r+30},${A.y+r} ${A.x},${A.y+2}`,
              mid:{x:A.x+r+22,y:A.y}};
    }
    const c=Math.max(46,Math.abs(B.x-A.x)*0.42)+lane*15;
    return {d:`M${A.x},${A.y} C${A.x+ends.tailDir*c},${A.y} ${B.x+ends.headDir*c},${B.y} ${B.x},${B.y}`,
            mid:{x:(A.x+B.x)/2+(ends.tailDir+ends.headDir)*c*0.26,y:(A.y+B.y)/2}};
  };
  // rule label anchored at condition tail
  const ruleLabelPos=(r)=>{
    const ends=segEnds(r,r.actions[0]||{name:'cycle-hold',target:'cycle'});
    const t=pos[ends.tailId];if(!t)return null;
    const P=t[ends.tailSide]||t.C;return {x:P.x+ends.tailDir*46,y:P.y};
  };
  // decluttered label positions (greedy vertical push when two overlap)
  const labels=useMemo(()=>{
    const arr=[];
    rules.filter(r=>filter[r.source]).forEach(r=>{const lp=ruleLabelPos(r);if(lp)arr.push({r,x:lp.x,y:lp.y-16});});
    arr.sort((a,b)=>a.y-b.y);
    for(let i=1;i<arr.length;i++)for(let j=0;j<i;j++)
      if(Math.abs(arr[i].x-arr[j].x)<135&&Math.abs(arr[i].y-arr[j].y)<21)arr[i].y=arr[j].y+22;
    return arr;
  },[rules,filter,pos]);

  const delRule=(id)=>{setRules(rs=>rs.filter(r=>r.id!==id));setSel(null);};
  const toggle=(k)=>setFilter(f=>({...f,[k]:!f[k]}));

  const saveRule=(r)=>{
    const src=deriveSource(r.cond,r.actions);
    const finalRule={...r,source:src};delete finalRule._editing;
    setRules(rs=>[...rs.filter(x=>x.id!==r.id),finalRule]);
    if(src==='dashboard'&&r.cond.end==='button'){
      const capAct=r.actions.find(a=>ACTIONS[a.name]&&(ACTIONS[a.name].zone==='capture'));
      const capId=capAct?capAct.target:(r.cond._capture||'cc1');
      const sec=DASH.find(d=>d.captureId===capId);
      if(sec&&!sec.buttons.find(b=>b.id===r.cond.ref)){
        sec.buttons.push({id:r.cond.ref,label:r.cond._label||'New Button',kind:'button'});
        setFreshBtn(r.cond.ref);setTimeout(()=>setFreshBtn(null),600);
      }
    }
    setBuilder(null);setTick(t=>t+1);
  };

  return (
    <React.Fragment>
      <div className="topbar">
        <h1>Rule Canvas</h1>
        <span className="sub">unified condition→action view</span>
        <div className="spacer"></div>
        <div className="legend">
          {Object.entries(SRC).map(([k,v])=>(
            <span key={k} className={'k'+(filter[k]?'':' off')} onClick={()=>toggle(k)}>
              <span className="sw" style={filter[k]?{background:v.hex}:{background:'#b6bfca'}}></span>{v.label}
            </span>
          ))}
        </div>
        <button className="btn" onClick={()=>setShowJSON(true)}>Export JSON</button>
        <button className="btn primary" onClick={()=>setBuilder(newDraft())}>+ New Rule</button>
      </div>

      <div className="stage">
        <div className="canvas" ref={canvasRef}>
          {/* LEFT PLC */}
          <div className="rail left">
            <div className="col-head"><span className="dot" style={{background:'var(--read)'}}></span>PLC</div>
            {PLC.map(p=>{
              const hot=involved.has('plc:'+p.id);
              const hc=hot?SRC[(rules.find(r=>r.id===active)||{source:'read'}).source].hex:null;
              return (
                <div className="tag" key={p.id} ref={setA('plc:'+p.id)}
                  style={hot?{borderColor:hc,boxShadow:'0 0 0 2px '+hc+'22'}:{}}>
                  <div className="lab">{p.lab}</div>
                  <div className="addr">{p.addr}</div>
                  <span className={'dt '+p.dt}>{p.dt}</span>
                </div>
              );
            })}
            <div className="tag" ref={setA('dbsink')} style={{textAlign:'center',color:'var(--muted)',borderStyle:'dashed'}}>
              <div className="lab" style={{fontSize:11}}>▤ DB sink</div>
            </div>
          </div>

          {/* CENTER trees */}
          <div className="trees">
            <div className="cycle" ref={setA('cyc')}>Line A · Cycle<small>INSTANCE ROOT · cycle actions land here</small></div>
            {CAPTURES.map(cap=>(
              <div className="capture" key={cap.id} ref={setA('cap:'+cap.id)}>
                <div className="cap-h"><span className="cam">📷</span><span className="nm">{cap.nm}</span><span className="cc">{cap.cc}</span></div>
                <div className="modrow">
                  {cap.modules.map(m=>{
                    const used=new Set();rules.forEach(r=>{if(r.cond.end==='node'&&r.cond.ref===m.id)used.add(r.cond.port);});
                    const hot=involved.has('node:'+m.id);
                    const hc=hot?SRC[(rules.find(r=>r.id===active)||{source:'read'}).source].hex:null;
                    return (
                      <div className={'node'+(liveNodes.has(m.id)?' live':'')+(hot?' hot':'')} key={m.id}
                        ref={setA('node:'+m.id)} style={hot?{'--hot':hc,borderColor:hc}:{}}>
                        <span className="nub L"></span><span className="nub R"></span>
                        <div className="nh"><span className="ty">{m.ty}</span><span className="nm">{m.nm}</span></div>
                        <div className="ports">{m.ports.map(([pn])=>(<span className={'port'+(used.has(pn)?' used':'')} key={pn}>{pn}</span>))}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* RIGHT dashboard */}
          <div className="rail right">
            <div className="col-head" ref={setA('dashcol')}><span className="dot" style={{background:'var(--dash)'}}></span>Dashboard</div>
            {DASH.map(d=>(
              <div className="dsec" key={d.id}>
                <div className="dh">📊 {d.title}</div>
                {d.buttons.length===0&&<div className="dbtn ghost">no buttons yet</div>}
                {d.buttons.map(b=>(
                  <div className={'dbtn'+(freshBtn===b.id?' fresh':'')} key={b.id} ref={setA('dash:'+b.id)}>
                    <div className="kind">{b.kind.toUpperCase()}</div>{b.label}
                  </div>
                ))}
              </div>
            ))}
            <div className="hint" style={{padding:'0 2px'}}>Dashboard actions auto-place a control in the section bound to the same <b>cameraConfigId</b>.</div>
          </div>

          {/* EDGES */}
          <svg className="edgelayer">
            <defs>{Object.entries(SRC).map(([k,v])=>(
              <marker key={k} id={'ah-'+k} markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M0,0 L7,3 L0,6 Z" fill={v.hex}/></marker>))}
            </defs>
            {segments.map((s,i)=>{
              const pp=buildPath(s.ends,s.lane);if(!pp)return null;
              const isActive=active===s.rule.id,dim=active&&!isActive;
              return <path key={i} className={'edge '+s.rule.source+(isActive?' hot':'')+(dim?' dim':'')}
                d={pp.d} stroke={SRC[s.rule.source].hex} markerEnd={'url(#ah-'+s.rule.source+')'}/>;
            })}
          </svg>
          {/* fan-out junction dots for multi-action rules */}
          {rules.filter(r=>filter[r.source]&&r.actions.length>1).map(r=>{
            const lp=ruleLabelPos(r);if(!lp)return null;const isActive=active===r.id;
            return <div key={'j'+r.id} className="jdot" style={{position:'absolute',left:lp.x,top:lp.y,
              width:8,height:8,borderRadius:'50%',background:SRC[r.source].hex,transform:'translate(-50%,-50%)',
              opacity:active&&!isActive?.15:1,zIndex:4}}/>;
          })}
          {/* RULE LABELS at condition tail (decluttered) */}
          {labels.map(({r,x,y})=>{
            const isActive=active===r.id,dim=active&&!isActive;
            return (
              <div key={'l'+r.id} className={'elabel'+(dim?' dim':'')}
                style={{left:x,top:y,borderColor:isActive?SRC[r.source].hex:'var(--line)',
                        color:isActive?SRC[r.source].hex:'var(--ink)'}}
                onMouseEnter={()=>setHover(r.id)} onMouseLeave={()=>setHover(null)} onClick={()=>setSel(r.id)}>
                {condText(r.cond)}{r.actions.length>1&&<span className="cnt">{r.actions.length}</span>}
              </div>
            );
          })}
        </div>
      </div>

      <RuleInspector rule={rules.find(r=>r.id===sel)} open={!!sel&&!builder}
        onClose={()=>setSel(null)} onDelete={delRule}
        onEdit={(r)=>{setBuilder({...JSON.parse(JSON.stringify(r)),_editing:true});setSel(null);}}/>

      {builder&&<RuleBuilder draft={builder} setDraft={setBuilder} onCancel={()=>setBuilder(null)} onSave={saveRule}/>}

      {showJSON&&<div className="modal-bg" onClick={()=>setShowJSON(false)}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <div className="insp-h"><span className="t">Export · {rules.length} rules</span><button className="x" onClick={()=>setShowJSON(false)}>×</button></div>
          <pre>{JSON.stringify(exportShape(rules),null,2)}</pre>
          <div className="insp-f"><div className="frow"><button className="btn primary" style={{flex:1}}
            onClick={()=>{const blob=new Blob([JSON.stringify(exportShape(rules),null,2)],{type:'application/json'});
              const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rules.json';a.click();}}>Download rules.json</button></div></div>
        </div>
      </div>}
    </React.Fragment>
  );
}

let _nid=100;
function newDraft(){return {id:'r'+(++_nid),cond:{end:'node',ref:'m1',port:'result',op:'=',val:'NG'},actions:[]};}

function RuleInspector({rule,open,onClose,onDelete,onEdit}){
  if(!rule)return <div className="inspector"></div>;
  const s=SRC[rule.source];
  return (
    <div className={'inspector'+(open?' open':'')}>
      <div className="insp-h"><span className="t">Rule detail</span><button className="x" onClick={onClose}>×</button></div>
      <div className="insp-b">
        <div className="srcchip" style={{background:s.hex+'18',color:s.hex}}><span className="badge" style={{background:s.hex}}>{s.label}</span> {s.desc}</div>
        <div className="fld" style={{marginTop:14}}><label>When (condition)</label><div style={{fontSize:13,fontWeight:600}}>{condText(rule.cond)}</div></div>
        <div className="fld"><label>Then ({rule.actions.length} action{rule.actions.length>1?'s':''})</label>
          {rule.actions.map((a,i)=>(
            <div className="actionitem" key={i}><div className="ah"><span className="nm">{actionText(a)}</span><span className="zbadge">{ACTIONS[a.name]?ACTIONS[a.name].zone:'?'}</span></div>
              {a.name==='write-to-plc'&&<div style={{fontSize:11,color:'var(--muted)'}}>{a.comm} · {a.valueMode} {a.val?('= '+a.val):''}{a.keyRef?('key '+a.keyRef):''}{a.byteOffset?(' · byte '+a.byteOffset):''}</div>}
            </div>
          ))}
        </div>
      </div>
      <div className="insp-f"><div className="frow">
        <button className="btn" onClick={()=>onEdit(rule)}>Edit</button>
        <button className="btn" style={{color:'var(--ng)',borderColor:'#f2c9c4'}} onClick={()=>onDelete(rule.id)}>Delete</button>
      </div></div>
    </div>
  );
}

function RuleBuilder({draft,setDraft,onCancel,onSave}){
  const d=draft;
  const setCond=(patch)=>setDraft({...d,cond:{...d.cond,...patch}});
  let dt='boolean';
  if(d.cond.end==='plc'){const p=plcById(d.cond.ref);dt=p?p.dt:'boolean';}
  else if(d.cond.end==='node'){const mb=moduleById(d.cond.ref);const port=mb&&mb.mod.ports.find(x=>x[0]===d.cond.port);dt=port?port[1]:'boolean';}
  const src=deriveSource(d.cond,d.actions);const s=SRC[src];
  // Actions are gated by the CONDITION END, not the derived source — otherwise a
  // node condition (which starts as "internal") could never add write-to-plc to
  // become a Write rule. The write/internal split is emergent from the chosen actions.
  const avail=Object.entries(ACTIONS);
  const errs=validate(d);

  const addAction=()=>setDraft({...d,actions:[...d.actions,defaultAction('trigger-image')]});
  const setAction=(i,patch)=>{const acts=d.actions.slice();acts[i]={...acts[i],...patch};setDraft({...d,actions:acts});};
  const rmAction=(i)=>{const acts=d.actions.slice();acts.splice(i,1);setDraft({...d,actions:acts});};

  return (
    <div className="inspector open">
      <div className="insp-h"><span className="t">{d._editing?'Edit rule':'New rule'}</span><button className="x" onClick={onCancel}>×</button></div>
      <div className="insp-b">
        <div className="srcchip" style={{background:s.hex+'18',color:s.hex}}><span className="badge" style={{background:s.hex}}>{s.label}</span> {s.desc}</div>
        <div className="dirhint">Source is derived automatically from where the condition sits and where the action lands.</div>

        <div className="fld" style={{marginTop:8}}><label>Condition sits on</label>
          <div className="seg">{[['node','Module output'],['plc','PLC value'],['button','Dashboard button']].map(([k,l])=>(
            <button key={k} className={d.cond.end===k?'on':''} onClick={()=>setCond(condDefaults(k))}>{l}</button>))}</div>
        </div>

        {d.cond.end==='node'&&<NodeCondition cond={d.cond} setCond={setCond} dt={dt}/>}
        {d.cond.end==='plc'&&<PlcCondition cond={d.cond} setCond={setCond} dt={dt}/>}
        {d.cond.end==='button'&&<div className="fld"><label>Button label</label>
          <input value={d.cond._label||''} placeholder="e.g. Re-run Cam 2" onChange={e=>setCond({_label:e.target.value})}/>
          <div className="dirhint">A control with this label is auto-placed in the dashboard section bound to the action's capture.</div></div>}

        <div className="fld" style={{marginTop:18}}><label>Then — actions</label>
          {d.actions.length===0&&<div className="hint">No actions yet. Add at least one.</div>}
          {d.actions.map((a,i)=>(
            <div className="actionitem" key={i}>
              <div className="ah"><span className="nm">Action {i+1}</span><button className="rm" onClick={()=>rmAction(i)}>remove</button></div>
              <div className="fld" style={{margin:0}}><select value={a.name} onChange={e=>setAction(i,defaultAction(e.target.value))}>
                {avail.map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></div>
              <ActionParams a={a} i={i} setAction={setAction}/>
            </div>
          ))}
          <button className="btn" style={{width:'100%',marginTop:4}} onClick={addAction}>+ Add action</button>
        </div>
      </div>
      <div className="insp-f">
        {errs.length>0&&<div className="errs"><div className="eh">{errs.length} to fix</div><ul style={{margin:0,padding:'0 0 0 14px'}}>{errs.map((e,i)=><li key={i}>{e}</li>)}</ul></div>}
        <div className="frow">
          <button className="btn" onClick={onCancel}>Cancel</button>
          <button className="btn primary" disabled={errs.length>0} onClick={()=>onSave(d)}>Save rule</button>
        </div>
      </div>
    </div>
  );
}

function condDefaults(end){
  if(end==='plc')return {end:'plc',ref:'p2',op:'>',val:'0'};
  if(end==='button')return {end:'button',ref:'nb'+(++_nid),_label:'',_capture:'cc1'};
  return {end:'node',ref:'m1',port:'result',op:'=',val:'NG'};
}
function defaultAction(name){
  const z=ACTIONS[name].zone;const a={name};
  if(z==='plc'){a.target='p3';a.comm='modbus-coil';a.valueMode='literal';a.val='1';a.coilAddress='';a.startRegister='';a.bitWidth='16';a.tcpIndex='';a.byteOffset='';a.ethDataType='Numeric';a.numericFormat='int';}
  else if(z==='capture')a.target='cc1';
  else if(name==='change-variant')a.target='v1';
  else if(z==='module'){a.target='m1';a.gtValue='';}
  else a.target=z;
  return a;
}

function NodeCondition({cond,setCond,dt}){
  const mb=moduleById(cond.ref);
  return (<React.Fragment>
    <div className="fld"><label>Module</label>
      <select value={cond.ref} onChange={e=>{const m2=moduleById(e.target.value);setCond({ref:e.target.value,port:m2.mod.ports[0][0]});}}>
        {CAPTURES.map(c=>(<optgroup key={c.id} label={c.nm}>{c.modules.map(m=><option key={m.id} value={m.id}>{m.ty} · {m.nm}</option>)}</optgroup>))}
      </select></div>
    <div className="fld"><label>Output port</label>
      <select value={cond.port} onChange={e=>setCond({port:e.target.value})}>{mb&&mb.mod.ports.map(([pn,pt])=><option key={pn} value={pn}>{pn} · {pt}</option>)}</select></div>
    <OpVal cond={cond} setCond={setCond} dt={dt}/>
  </React.Fragment>);
}
function PlcCondition({cond,setCond,dt}){
  return (<React.Fragment>
    <div className="fld"><label>PLC tag</label><select value={cond.ref} onChange={e=>setCond({ref:e.target.value})}>
      {PLC.map(p=><option key={p.id} value={p.id}>{p.lab} · {p.addr}</option>)}</select></div>
    <OpVal cond={cond} setCond={setCond} dt={dt}/>
  </React.Fragment>);
}
function OpVal({cond,setCond,dt}){
  const ops=OPS[dt]||OPS.boolean;
  if(!ops.some(o=>o[0]===cond.op)&&ops[0])setTimeout(()=>setCond({op:ops[0][0]}),0);
  return (<div className="row2">
    <div className="fld"><label>Operator</label><select value={cond.op} onChange={e=>setCond({op:e.target.value})}>
      {ops.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>
    {cond.op!=='always'&&<div className="fld"><label>Value</label>
      <input value={cond.val||''} onChange={e=>setCond({val:e.target.value})} placeholder={dt==='boolean'?'NG / OK':dt==='number'?'0':'text'}/></div>}
  </div>);
}

function ActionParams({a,i,setAction}){
  const z=ACTIONS[a.name].zone;
  if(a.name==='write-to-plc')return (
    <div style={{marginTop:8}}>
      <div className="fld" style={{margin:'0 0 8px'}}><label>PLC tag (arrow target)</label>
        <select value={a.target} onChange={e=>setAction(i,{target:e.target.value})}>{PLC.map(p=><option key={p.id} value={p.id}>{p.lab}</option>)}</select></div>
      <div className="fld" style={{margin:'0 0 8px'}}><label>Protocol / target type</label>
        <select value={a.comm} onChange={e=>setAction(i,{comm:e.target.value})}>
          <option value="modbus-coil">Modbus · Coil</option>
          <option value="modbus-register">Modbus · Register</option>
          <option value="tcp">TCP-IP</option>
          <option value="ethernet">EtherNet/IP</option>
        </select></div>
      {a.comm==='modbus-coil'&&<div className="fld" style={{margin:'0 0 8px'}}><label>Coil address</label>
        <input value={a.coilAddress||''} onChange={e=>setAction(i,{coilAddress:e.target.value})} placeholder="20"/></div>}
      {a.comm==='modbus-register'&&<div className="row2"><div className="fld" style={{margin:'0 0 8px'}}><label>Start register</label>
        <input value={a.startRegister||''} onChange={e=>setAction(i,{startRegister:e.target.value})} placeholder="40001"/></div>
        <div className="fld" style={{margin:'0 0 8px'}}><label>Bit width</label>
          <select value={a.bitWidth} onChange={e=>setAction(i,{bitWidth:e.target.value})}><option>16</option><option>32</option></select></div></div>}
      {a.comm==='tcp'&&<div className="fld" style={{margin:'0 0 8px'}}><label>TCP write index</label>
        <input value={a.tcpIndex||''} onChange={e=>setAction(i,{tcpIndex:e.target.value})} placeholder="0"/></div>}
      {a.comm==='ethernet'&&<div className="row2"><div className="fld" style={{margin:'0 0 8px'}}><label>Byte offset</label>
        <input value={a.byteOffset||''} onChange={e=>setAction(i,{byteOffset:e.target.value})} placeholder="4"/></div>
        <div className="fld" style={{margin:'0 0 8px'}}><label>Data type</label>
          <select value={a.ethDataType} onChange={e=>setAction(i,{ethDataType:e.target.value})}><option>Numeric</option><option>Boolean</option><option>String</option></select></div></div>}
      <div className="fld" style={{margin:'0 0 8px'}}><label>Value mode</label>
        <select value={a.valueMode} onChange={e=>setAction(i,{valueMode:e.target.value})}>
          <option value="preselect">Pre-selected key</option>
          <option value="customkey">Custom key</option>
          <option value="literal">Custom value</option>
        </select></div>
      {a.valueMode==='literal'&&<div className="fld" style={{margin:0}}><label>Literal value</label>
        <input value={a.val||''} onChange={e=>setAction(i,{val:e.target.value})} placeholder="1"/></div>}
      {a.valueMode==='customkey'&&<div className="fld" style={{margin:0}}><label>Source key (module output)</label>
        <select value={a.keyRef||''} onChange={e=>setAction(i,{keyRef:e.target.value})}>
          <option value="">— pick —</option>
          {CAPTURES.map(c=>(<optgroup key={c.id} label={c.nm}>{c.modules.map(m=>m.ports.map(([pn])=>
            <option key={m.id+pn} value={m.id+'.'+pn}>{m.ty}.{pn}</option>))}</optgroup>))}
        </select></div>}
    </div>
  );
  if(z==='capture')return (<div className="fld" style={{margin:'8px 0 0'}}><label>Target capture</label>
    <select value={a.target} onChange={e=>setAction(i,{target:e.target.value})}>{CAPTURES.map(c=><option key={c.id} value={c.id}>{c.nm}</option>)}</select></div>);
  if(a.name==='change-variant')return (<div className="fld" style={{margin:'8px 0 0'}}><label>Target variant</label>
    <select value={a.target} onChange={e=>setAction(i,{target:e.target.value})}>{VARIANTS.map(v=><option key={v.id} value={v.id}>{v.nm}</option>)}</select></div>);
  if(z==='module')return (
    <div style={{marginTop:8}}>
      <div className="fld" style={{margin:'0 0 8px'}}><label>Target module</label>
        <select value={a.target} onChange={e=>setAction(i,{target:e.target.value})}>
          {CAPTURES.map(c=>(<optgroup key={c.id} label={c.nm}>{c.modules.map(m=><option key={m.id} value={m.id}>{m.ty} · {m.nm}</option>)}</optgroup>))}</select></div>
      {a.name==='change-ground-truth'&&<div className="fld" style={{margin:0}}><label>New ground-truth value</label>
        <input value={a.gtValue||''} onChange={e=>setAction(i,{gtValue:e.target.value})} placeholder="e.g. OK / ABC123"/></div>}
    </div>
  );
  return <div className="dirhint" style={{marginTop:6}}>Lands on <b>{z}</b> (no target to pick).</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  const src=document.querySelector('script[type="text/jsx-source"]').textContent;
  const out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
  new Function(out)();
</script>
</body>
